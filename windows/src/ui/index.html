<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101219">
<meta name="color-scheme" content="dark">
<title>HoloLoop</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="stylesheet" href="app.css">
</head>
<body>
<aside id="side">
  <div class="brand"><img src="icon.png" alt=""><span>HoloLoop</span></div>
  <div id="navlist"></div>
  <div class="spacer"></div>
  <div class="stamp" id="stamp"></div>
</aside>
<main id="page"></main>
<nav id="tabs"></nav>
<div id="toast" hidden></div>
<div id="modal" hidden></div>
<div id="login" hidden>
  <form id="loginForm" class="card login">
    <img src="icon.png" alt="" class="login-icon">
    <h1>HoloLoop</h1>
    <p class="lede">Type the PIN shown in HoloLoop's Settings on the PC.</p>
    <input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="8" placeholder="PIN">
    <button class="primary big" type="submit">Connect</button>
    <p class="muted" id="loginErr"></p>
  </form>
</div>
<div id="cursor" hidden></div>
<script src="app.js"></script>
</body>
</html>
